name: Kings Food POS Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kings-food-windows-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Upgrade npm
        shell: pwsh
        run: npm install --global npm@11

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Kings Food POS version: $version"
          Write-Host "Windows installer target: x64 + ia32 (single NSIS installer with automatic architecture selection)"

      - name: Build Windows installer
        shell: pwsh
        run: npm run build:win

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "release/Kings-Food-POS-${{ steps.version.outputs.version }}.exe"
          if (!(Test-Path $installer)) {
            Write-Host "Release directory contents:"
            Get-ChildItem -Recurse release | Select-Object FullName, Length
            throw "Expected dual-architecture installer was not produced: $installer"
          }
          Get-Item $installer | Format-List FullName, Length, LastWriteTime

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kings-Food-POS-Windows-${{ steps.version.outputs.version }}
          path: release/Kings-Food-POS-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $installer = "release/Kings-Food-POS-${{ steps.version.outputs.version }}.exe"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "Kings Food POS ${{ steps.version.outputs.version }}" --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release upload $tag $installer --clobber
            }
          }
