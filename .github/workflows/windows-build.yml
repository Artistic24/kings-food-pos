name: Medical Centre POS Windows Release

on:
  push:
    branches: [medical-health-center-v1.3.0, release/medical-centre-v1.3.0]
    tags: ["v*-medical*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medical-centre-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Upgrade npm
        shell: pwsh
        run: npm install --global npm@11

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Medical Centre POS version: $version"

      - name: Check Electron entry points
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/receipts.cjs

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Medical Centre POS Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from pathlib import Path
          from PIL import Image, ImageDraw

          image = Image.new("RGBA", (256, 256), (15, 118, 110, 255))
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((8, 8, 248, 248), radius=48, fill=(15, 118, 110, 255))
          draw.rounded_rectangle((104, 48, 152, 208), radius=14, fill=(255, 255, 255, 255))
          draw.rounded_rectangle((48, 104, 208, 152), radius=14, fill=(255, 255, 255, 255))
          image.save(Path("public/icons/medical-centre.ico"), format="ICO", sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])
          '@ | python -

      - name: Build Windows installer
        shell: pwsh
        run: npm run build:win

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "release/Medical-Centre-POS-${{ steps.version.outputs.version }}.exe"
          if (!(Test-Path $installer)) {
            Write-Host "Release directory contents:"
            Get-ChildItem -Recurse release | Select-Object FullName, Length
            throw "Expected medical-centre installer was not produced: $installer"
          }
          Get-Item $installer | Format-List FullName, Length, LastWriteTime

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medical-Centre-POS-Windows-${{ steps.version.outputs.version }}
          path: release/Medical-Centre-POS-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows installer to the versioned GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-medical')) || github.ref == 'refs/heads/release/medical-centre-v1.3.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $installer = "release/Medical-Centre-POS-${{ steps.version.outputs.version }}.exe"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Medical Centre POS ${{ steps.version.outputs.version }}" --notes "Medical Centre POS Windows release. Offline-first cashier, pharmacy and laboratory receipts." --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Could not create or access GitHub Release $tag" }
            }
          }
          gh release upload $tag $installer --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the Windows installer to $tag" }
