name: Medical Centre POS Android Release

on:
  push:
    branches: [medical-health-center-v1.3.0, release/medical-centre-v1.3.0]
    tags: ["v*-medical*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medical-centre-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDICAL_POS_STABLE_SIGNING: ${{ secrets.MEDICAL_POS_KEYSTORE_BASE64 != '' && secrets.MEDICAL_POS_KEYSTORE_PASSWORD != '' && secrets.MEDICAL_POS_KEY_ALIAS != '' && secrets.MEDICAL_POS_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run automated regression tests
        run: npm test

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Medical Centre POS version: $VERSION"

      - name: Generate Capacitor Android project
        run: npm run android:add

      - name: Build Android web assets and sync
        run: npm run android:sync

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Restore persistent Android signing key
        if: env.MEDICAL_POS_STABLE_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDICAL_POS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/medical-centre-release.jks"
          test -s "$RUNNER_TEMP/medical-centre-release.jks"

      - name: Create temporary CI-only signing key
        if: env.MEDICAL_POS_STABLE_SIGNING != 'true'
        env:
          KEYSTORE_PASSWORD: medical-centre-release-${{ github.run_id }}
          KEY_PASSWORD: medical-centre-release-${{ github.run_id }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/medical-centre-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias medical-centre-pos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Medical Centre POS, OU=Medical Centre, O=Medical Centre, L=Yaounde, ST=Centre, C=CM"

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MEDICAL_POS_KEYSTORE_PASSWORD || format('medical-centre-release-{0}', github.run_id) }}
          KEY_PASSWORD: ${{ secrets.MEDICAL_POS_KEY_PASSWORD || format('medical-centre-release-{0}', github.run_id) }}
          KEY_ALIAS: ${{ secrets.MEDICAL_POS_KEY_ALIAS || 'medical-centre-pos' }}
        run: |
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED="android/app/build/outputs/apk/release/app-release.apk"
          fi
          test -f "$UNSIGNED"
          ZIPALIGNED="$RUNNER_TEMP/Medical-Centre-POS-${{ steps.version.outputs.version }}-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ZIPALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/medical-centre-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias medical-centre-pos \
            --out "Medical-Centre-POS-${{ steps.version.outputs.version }}.apk" \
            "$ZIPALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "Medical-Centre-POS-${{ steps.version.outputs.version }}.apk"

      - name: Verify APK
        run: |
          test -s "Medical-Centre-POS-${{ steps.version.outputs.version }}.apk"
          ls -lh "Medical-Centre-POS-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medical-Centre-POS-${{ steps.version.outputs.version }}
          path: Medical-Centre-POS-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the versioned GitHub Release
        if: env.MEDICAL_POS_STABLE_SIGNING == 'true' && ((startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-medical')) || github.ref == 'refs/heads/release/medical-centre-v1.3.0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          TITLE="Medical Centre POS ${{ steps.version.outputs.version }}"
          ASSET="Medical-Centre-POS-${{ steps.version.outputs.version }}.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "Medical Centre POS release. Android APK for medical-centre cashier, pharmacy and laboratory receipts." --target "$GITHUB_SHA" || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "$ASSET" --clobber
