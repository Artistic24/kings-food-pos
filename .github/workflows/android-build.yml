name: Kings Food POS Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Kings Food POS version: $VERSION"

      - name: Generate Capacitor Android project
        run: npm run android:add

      - name: Build Android web assets and sync
        run: npm run android:sync

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Create temporary release signing key
        env:
          KEYSTORE_PASSWORD: kings-food-release-${{ github.run_id }}
          KEY_PASSWORD: kings-food-release-${{ github.run_id }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/kings-food-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias kings-food-pos \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Kings Food POS, OU=Kings Food, O=Kings Food, L=Yaounde, ST=Centre, C=CM"

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: kings-food-release-${{ github.run_id }}
          KEY_PASSWORD: kings-food-release-${{ github.run_id }}
        run: |
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED="android/app/build/outputs/apk/release/app-release.apk"
          fi
          test -f "$UNSIGNED"
          ZIPALIGNED="$RUNNER_TEMP/Kings-Food-POS-${{ steps.version.outputs.version }}-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ZIPALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/kings-food-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias kings-food-pos \
            --out "Kings-Food-POS-${{ steps.version.outputs.version }}.apk" \
            "$ZIPALIGNED"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cp "Kings-Food-POS-${{ steps.version.outputs.version }}.apk" "Kings-Food-POS-${{ steps.version.outputs.version }}-Android-Printing.apk"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "Kings-Food-POS-${{ steps.version.outputs.version }}.apk"

      - name: Verify APK
        run: |
          test -s "Kings-Food-POS-${{ steps.version.outputs.version }}.apk"
          ls -lh "Kings-Food-POS-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kings-Food-POS-${{ steps.version.outputs.version }}
          path: Kings-Food-POS-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          TITLE="Kings Food POS ${{ steps.version.outputs.version }}"
          ASSET="Kings-Food-POS-${{ steps.version.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET"
          else
            gh release create "$TAG" "$ASSET" --title "$TITLE" --generate-notes
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET"
          else
            gh release create "$TAG" "$ASSET" --title "$TITLE" --generate-notes
          fi
