name: Kings Food POS Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Kings Food POS version: $VERSION"

      - name: Generate Capacitor Android project
        run: npm run android:add

      - name: Build Android web assets and sync
        run: npm run android:sync

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare stable Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KINGS_FOOD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret KINGS_FOOD_ANDROID_KEYSTORE_BASE64."
            echo "Google Sign-In requires a stable Android signing certificate; do not use a temporary key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kings-food-release.jks"
          test -s "$RUNNER_TEMP/kings-food-release.jks"

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KINGS_FOOD_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KINGS_FOOD_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KINGS_FOOD_ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Missing one or more Android signing secrets."
            exit 1
          fi
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED="android/app/build/outputs/apk/release/app-release.apk"
          fi
          test -f "$UNSIGNED"
          ZIPALIGNED="$RUNNER_TEMP/Kings-Food-POS-${{ steps.version.outputs.version }}-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" "$ZIPALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/kings-food-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "Kings-Food-POS-${{ steps.version.outputs.version }}.apk" \
            "$ZIPALIGNED"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cp "Kings-Food-POS-${{ steps.version.outputs.version }}.apk" "Kings-Food-POS-${{ steps.version.outputs.version }}-Android-Printing.apk"
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "Kings-Food-POS-${{ steps.version.outputs.version }}.apk"

      - name: Verify APK
        run: |
          test -s "Kings-Food-POS-${{ steps.version.outputs.version }}.apk"
          ls -lh "Kings-Food-POS-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kings-Food-POS-${{ steps.version.outputs.version }}
          path: Kings-Food-POS-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          TITLE="Kings Food POS ${{ steps.version.outputs.version }}"
          ASSET="Kings-Food-POS-${{ steps.version.outputs.version }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET"
          elif gh release create "$TAG" "$ASSET" --title "$TITLE" --generate-notes; then
            echo "Created release $TAG with the Android APK."
          else
            echo "Release $TAG appeared during publication; uploading the APK now."
            gh release upload "$TAG" "$ASSET"
          fi
